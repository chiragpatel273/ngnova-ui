<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NgNova UI | Accessible Angular 22 component library</title>
    <meta
      name="description"
      content="Open-source Angular 22 component library: 40 accessible standalone components with focused imports, Tailwind CSS v4 theming, dark mode, Signal Forms support, and test harnesses."
    />
    <base href="/" />
    <script>
      // Keep pre-1.1 hash links working: /#/components/button -> /components/button
      (function () {
        var hash = window.location.hash;
        if (hash.indexOf('#/') === 0) {
          var base = document.querySelector('base').getAttribute('href') || '/';
          window.location.replace(base + hash.slice(2));
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
