name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify library
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test library
        run: npm run test:lib

      - name: Build library
        run: npm run build:lib

      - name: Build docs app
        run: npm run build:demo

      - name: Verify npm package
        working-directory: dist/ui
        run: npm pack --dry-run
